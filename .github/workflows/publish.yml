name: Check and publish offline editions

on:
  schedule:
    # Sunday at 06:23 UTC. Checks weekly; publishes only on content changes.
    - cron: "23 6 * * 0"
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild and publish even when source content is unchanged
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "scripts/snapshot.py"
      - "scripts/build.py"
      - "scripts/docx-cover.lua"
      - "scripts/releases.py"
      - "styles/**"
      - "tests/test_pipeline.py"
      - "requirements*"
      - ".github/workflows/publish.yml"
  pull_request:
    paths:
      - "scripts/snapshot.py"
      - "scripts/build.py"
      - "scripts/docx-cover.lua"
      - "scripts/releases.py"
      - "styles/**"
      - "tests/test_pipeline.py"
      - "requirements*"
      - ".github/workflows/publish.yml"

permissions:
  contents: read

concurrency:
  group: book-${{ github.event_name == 'pull_request' && github.ref || 'publication' }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --require-hashes -r requirements.txt
      - run: python -m unittest discover -s tests -v

  check:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      changed: ${{ steps.capture.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --require-hashes -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Read last successfully published edition
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m scripts.releases baseline
      - name: Capture and compare source content
        id: capture
        env:
          FORCE: ${{ inputs.force || false }}
        shell: bash
        run: |
          args=()
          if [[ -f .work/previous.json ]]; then
            args+=(--previous .work/previous.json)
          fi
          if [[ "$FORCE" == "true" ]]; then
            args+=(--force)
          fi
          python -m scripts.snapshot "${args[@]}"
      - name: Install document converters
        if: steps.capture.outputs.changed == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y pandoc poppler-utils fonts-dejavu-core epubcheck
      - name: Build and validate every format
        if: steps.capture.outputs.changed == 'true'
        run: |
          python -m scripts.build
          epubcheck dist/grade-book.epub
      - name: Stage validated release assets
        if: steps.capture.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: offline-edition
          path: |
            dist/grade-book.*
            dist/grade-book-html.zip
            dist/manifest.json
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

  publish:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Download validated edition
        if: needs.check.outputs.changed == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: offline-edition
          path: dist
      - name: Publish complete release
        if: needs.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m scripts.releases baseline
          python -m scripts.releases publish
      - name: Keep periodic checks active
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python -m scripts.releases heartbeat

  website:
    needs: [check, publish]
    if: needs.check.outputs.changed == 'true'
    # GITHUB_TOKEN release events do not start another workflow. Call Pages
    # directly after publication so every new edition appears on the website.
    uses: ./.github/workflows/pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
